<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found | Churnika Marappa Reddy</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#07060f" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Manrope:wght@500;600&family=JetBrains+Mono&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#07060f; --ink:#f4f1ff; --soft:#b9b2d6; --faint:#7a7399; --violet:#a78bfa; --pink:#f472b6; --line:rgba(167,139,250,.25);
    --grad:linear-gradient(120deg,#c4b5fd 0%,#a78bfa 30%,#f472b6 70%,#fb923c 100%); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: Manrope, system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; }
  .glow { position: fixed; width: 560px; height: 560px; border-radius: 50%; filter: blur(110px); opacity: .35; }
  .g1 { background: #7c3aed; left: -160px; top: -200px; } .g2 { background: #ec4899; right: -180px; bottom: -240px; }
  main { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  .k { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--violet); }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(120px, 30vw, 300px); line-height: .85; letter-spacing: -.06em; margin: 14px 0 8px;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; position: relative; animation: float 5s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-12px); } }
  .term { font-family: 'JetBrains Mono', monospace; font-size: clamp(13px, 1.6vw, 15px); color: var(--soft); background: rgba(20,16,40,.7); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 20px; text-align: left; max-width: 520px; width: 100%; margin: 18px 0 28px; }
  .term b { color: var(--pink); font-weight: 400; } .term i { color: #34d399; font-style: normal; } .term .cur { display: inline-block; width: 9px; height: 17px; background: var(--ink); vertical-align: -3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  p.lead { color: var(--soft); font-size: 17px; max-width: 460px; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  a.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 12px; font-weight: 600; font-size: 15px; text-decoration: none; color: var(--ink);
    border: 1px solid var(--line); background: rgba(167,139,250,.1); transition: transform .2s, background .2s; }
  a.btn:hover { transform: translateY(-2px); background: rgba(167,139,250,.2); }
  a.btn.primary { background: var(--ink); color: #0b0717; border-color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { h1, .cur { animation: none; } }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<canvas id="c" aria-hidden="true"></canvas>
<main>
  <div class="k">Error · page not found</div>
  <h1>404</h1>
  <p class="lead">This page drifted out of the pipeline. Let’s get you back to something that exists.</p>
  <div class="term" aria-hidden="true">
    <div><b>$</b> curl <span id="path"></span></div>
    <div><i>✖</i> 404 · no rows returned</div>
    <div><b>$</b> cd ~/portfolio <span class="cur"></span></div>
  </div>
  <div class="btns">
    <a class="btn primary" href="/">← Back home</a>
    <a class="btn" href="/#projects">See projects</a>
    <a class="btn" href="/#contact">Contact me</a>
  </div>
</main>
<script>
  document.getElementById('path').textContent = location.pathname
  // drifting data points
  const c = document.getElementById('c'), x = c.getContext('2d')
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  let W, H, pts = []
  const cols = ['#a78bfa', '#f472b6', '#22d3ee', '#c4b5fd']
  function size() {
    const d = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight
    c.width = W * d; c.height = H * d; c.style.width = W + 'px'; c.style.height = H + 'px'; x.setTransform(d, 0, 0, d, 0, 0)
    pts = Array.from({ length: Math.min(90, Math.floor(W * H / 14000)) }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * 4)] }))
  }
  function draw() {
    x.clearRect(0, 0, W, H)
    for (const p of pts) {
      if (!reduce) { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1 }
      x.fillStyle = p.c; x.globalAlpha = .8; x.beginPath(); x.arc(p.x, p.y, 1.6, 0, 7); x.fill()
    }
    x.globalAlpha = .12; x.strokeStyle = '#a78bfa'
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y)
      if (d < 120) { x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke() }
    }
    x.globalAlpha = 1
    if (!reduce) requestAnimationFrame(draw)
  }
  addEventListener('resize', size); size(); draw()
</script>
</body>
</html>
